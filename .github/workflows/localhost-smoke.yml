name: Localhost runtime smoke (Windows)
on:
  push:
    branches:
      - test/localhost-runtime-smoke
  pull_request:
    paths:
      - 'GameServer/localhost-smoke.ps1'
      - '.github/workflows/localhost-smoke.yml'
  workflow_dispatch:

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: MSBuild setup
        uses: microsoft/setup-msbuild@v2
      - name: Build AccountServer Release
        shell: pwsh
        run: msbuild "AccServer/AccServer.sln" /restore /m /p:Configuration=Release "/p:Platform=Any CPU" /v:minimal
      - name: Build GameServer Debug x86
        shell: pwsh
        run: msbuild "GameServer/COServer.sln" /m /p:Configuration=Debug /p:Platform=x86 /v:minimal
      - name: Launch both and probe localhost
        shell: pwsh
        run: ./GameServer/localhost-smoke.ps1
